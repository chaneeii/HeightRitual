<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101412"/>
      <stop offset="1" stop-color="#1b211e"/>
    </linearGradient>
    <radialGradient id="beam" cx="0.72" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#e9b34a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e9b34a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c062" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f2c062" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="small" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc98f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7fc98f" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="520" fill="url(#wall)"/>
  <rect width="1280" height="520" fill="url(#beam)"/>
  <!-- floor -->
  <rect y="470" width="1280" height="50" fill="#0b0d0c"/>
  <line x1="0" y1="470" x2="1280" y2="470" stroke="#3a423e" stroke-width="2"/>

  <!-- ruler: 1 cm = 2.6 px, floor at y=470 -->
  <g stroke="#59625d" stroke-width="1.5">
    <line x1="660" y1="470" x2="660" y2="80"/>
  </g>
  <g fill="#7d8781" font-size="13" text-anchor="end">
    <text x="650" y="474">0</text>
    <text x="650" y="344">50</text>
    <text x="650" y="214">100</text>
    <text x="650" y="84">150</text>
  </g>
  <g stroke="#59625d" stroke-width="1.5">
    <line x1="660" y1="470" x2="676" y2="470"/>
    <line x1="660" y1="340" x2="676" y2="340"/>
    <line x1="660" y1="210" x2="676" y2="210"/>
    <line x1="660" y1="80" x2="676" y2="80"/>
    <line x1="660" y1="405" x2="670" y2="405"/>
    <line x1="660" y1="275" x2="670" y2="275"/>
    <line x1="660" y1="145" x2="670" y2="145"/>
  </g>

  <!-- pencil marks, Nora: 90, 100, 108, 113, 116, 121 cm -->
  <g stroke="#e9b34a" stroke-width="2">
    <line x1="700" y1="236" x2="1040" y2="236" stroke-opacity="0.35"/>
    <line x1="700" y1="210" x2="1040" y2="210" stroke-opacity="0.45"/>
    <line x1="700" y1="189" x2="1040" y2="189" stroke-opacity="0.55"/>
    <line x1="700" y1="176" x2="1040" y2="176" stroke-opacity="0.65"/>
    <line x1="700" y1="168" x2="1040" y2="168" stroke-opacity="0.75"/>
    <line x1="700" y1="155" x2="1040" y2="155" stroke-width="3"/>
  </g>
  <g fill="#e9b34a" font-size="13" font-style="italic">
    <text x="1050" y="240" fill-opacity="0.5">Aug 2020  90 cm</text>
    <text x="1050" y="214" fill-opacity="0.6">Aug 2021  100 cm</text>
    <text x="1050" y="193" fill-opacity="0.7">Aug 2022  108 cm</text>
    <text x="1050" y="159" font-weight="600" font-size="15">Aug 2025  121 cm</text>
  </g>

  <!-- life-size figures: Nora 121 cm, a younger record ghosted behind -->
  <g transform="translate(800 155)" fill="url(#figure)">
    <circle cx="40" cy="30" r="28"/>
    <rect x="12" y="64" width="56" height="112" rx="22"/>
    <rect x="-6" y="70" width="16" height="96" rx="8"/>
    <rect x="70" y="70" width="16" height="96" rx="8"/>
    <rect x="16" y="168" width="22" height="147" rx="10"/>
    <rect x="42" y="168" width="22" height="147" rx="10"/>
  </g>
  <g transform="translate(905 236) scale(0.74)" fill="url(#small)" opacity="0.8">
    <circle cx="40" cy="30" r="28"/>
    <rect x="12" y="64" width="56" height="112" rx="22"/>
    <rect x="-6" y="70" width="16" height="96" rx="8"/>
    <rect x="70" y="70" width="16" height="96" rx="8"/>
    <rect x="16" y="168" width="22" height="147" rx="10"/>
    <rect x="42" y="168" width="22" height="147" rx="10"/>
  </g>
  <!-- foot marks -->
  <g fill="#7fc98f" fill-opacity="0.6">
    <rect x="812" y="474" width="24" height="8" rx="4"/>
    <rect x="846" y="474" width="24" height="8" rx="4"/>
  </g>

  <!-- title block -->
  <text x="72" y="196" fill="#f1f3ef" font-size="76" font-weight="700" letter-spacing="-1.5">Height Ritual</text>
  <text x="74" y="246" fill="#aeb7b1" font-size="25">The pencil marks on the doorframe,</text>
  <text x="74" y="280" fill="#aeb7b1" font-size="25">filmed, life-size, and coming with you.</text>
  <g font-size="15" fill="#7d8781">
    <text x="74" y="352">iOS app  ·  ESP32 controller  ·  projector</text>
    <text x="74" y="378">KTH DM2601  ·  Group 6  ·  2026</text>
  </g>
</svg>
