<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" font-family="Poppins, -apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Memory Meter: people move, memories stay</title>
  <defs>
    <pattern id="minor" width="56" height="12" patternUnits="userSpaceOnUse">
      <rect x="44" y="0" width="12" height="1.5" fill="#111"/>
    </pattern>
    <pattern id="major" width="56" height="60" patternUnits="userSpaceOnUse">
      <rect x="32" y="0" width="24" height="3" fill="#111"/>
    </pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- wall -->
  <rect width="1280" height="520" fill="#ebe8e1"/>

  <!-- measuring ruler (workbook contents page motif) -->
  <rect x="0" y="0" width="56" height="520" fill="#ffe58f"/>
  <rect x="0" y="0" width="56" height="520" fill="url(#minor)"/>
  <rect x="0" y="0" width="56" height="520" fill="url(#major)"/>
  <g font-size="11" font-weight="700" fill="#111" text-anchor="start">
    <text x="6" y="64">190</text>
    <text x="6" y="124">180</text>
    <text x="6" y="184">170</text>
    <text x="6" y="244">160</text>
    <text x="6" y="304">150</text>
    <text x="6" y="364">140</text>
    <text x="6" y="424">130</text>
    <text x="6" y="484">120</text>
  </g>

  <!-- app icon -->
  <g transform="translate(120 140)" filter="url(#lift)">
    <rect width="240" height="240" rx="54" fill="#fff"/>
    <circle cx="120" cy="120" r="75" fill="#111"/>
    <line x1="86" y1="153" x2="154" y2="86" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="410" y="206" font-size="88" font-weight="800" fill="#111" letter-spacing="-3">Memory Meter</text>
  <text x="412" y="266" font-size="38" font-weight="800" fill="#111" letter-spacing="-1">People move.</text>
  <rect x="400" y="284" width="320" height="56" rx="8" fill="#ffe58f"/>
  <text x="414" y="324" font-size="38" font-weight="800" fill="#111" textLength="292" lengthAdjust="spacingAndGlyphs">Memories stay.</text>
  <text x="412" y="384" font-size="20" font-weight="500" fill="#6b6860">Film a height at the wall. Keep every record. See it life-size anywhere.</text>
  <text x="412" y="420" font-size="15" font-weight="700" fill="#111" letter-spacing="1.5">DM2601 · GROUP 6 · KTH</text>

  <!-- pencil height marks -->
  <g stroke="#111" stroke-linecap="round">
    <line x1="1110" y1="96" x2="1210" y2="96" stroke-width="3"/>
    <line x1="1110" y1="150" x2="1200" y2="150" stroke-width="3"/>
    <line x1="1110" y1="214" x2="1206" y2="214" stroke-width="3"/>
    <line x1="1110" y1="290" x2="1196" y2="290" stroke-width="3"/>
    <line x1="1110" y1="372" x2="1202" y2="372" stroke-width="3"/>
  </g>
  <g font-size="13" font-weight="700" fill="#6b6860" text-anchor="end">
    <text x="1100" y="101">2026</text>
    <text x="1100" y="155">2024</text>
    <text x="1100" y="219">2022</text>
    <text x="1100" y="295">2020</text>
    <text x="1100" y="377">2018</text>
  </g>
</svg>
